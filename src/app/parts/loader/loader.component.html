<!-- timer-bar.component.html -->
<div class="timer-container">
  <svg viewBox="0 0 100 30" class="progress-svg">
    <!-- Background Curve -->
    <path
      d="M 5 20 Q 50 0, 95 20"
      stroke="#ddd"
      stroke-width="4"
      fill="transparent"
    />
    <!-- Foreground Progress -->
    <path
      d="M 5 20 Q 50 0, 95 20"
      stroke="url(#grad)"
      stroke-width="4"
      fill="transparent"
      stroke-dasharray="100"
      [attr.stroke-dashoffset]="100 - progressPercent"
      style="transition: stroke-dashoffset 1s linear;"
    />
    <!-- Timer Badge (centered inside curve) -->
    <text
      x="50"
      y="22"
      text-anchor="middle"
      alignment-baseline="middle"
      class="badge-text"
    >
      {{ remaining }}s
    </text>

    <!-- Gradient definition -->
    <defs>
      <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#4cafef;" />
        <stop offset="100%" style="stop-color:#3f51b5;" />
      </linearGradient>
    </defs>
  </svg>
</div>
